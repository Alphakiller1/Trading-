# Publishes the FOMO Command interface (fomo/dashboard/static) to GitHub Pages.
# The page talks to the engine running on your own PC (python fomo/dashboard/server.py);
# no trading data, wallet data or keys are deployed.
name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
    paths: ["fomo/dashboard/static/**", ".github/workflows/dashboard-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/static
          cp fomo/dashboard/static/index.html _site/index.html
          cp fomo/dashboard/static/app.css fomo/dashboard/static/app.js _site/static/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
